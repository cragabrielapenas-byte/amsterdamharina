// ---------------------------------------------------------------------------
// UTILIDADES GENERALES
// ---------------------------------------------------------------------------

function qs(sel, root) { return (root || document).querySelector(sel) }
function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)) }
function escapeHtml(str) {
  if (str === null || str === undefined) return ''
  return String(str)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;')
}
function fmtKg(n) { return `${Number(n || 0).toFixed(0)} kg` }
function fmtKg1(n) { return `${Number(n || 0).toFixed(1)} kg` }
function fmtMoney(n) { return n === null || n === undefined ? '—' : `$${Number(n).toFixed(0)}` }

// ---------------------------------------------------------------------------
// CONVERSIÓN A LA UNIDAD DEL PRODUCTO (por defecto trabajamos en bolsas — es
// lo que se entiende en la panadería. Por dentro todo se sigue guardando y
// calculando en kg para no perder precisión; esto es solo para mostrar).
// ---------------------------------------------------------------------------

function unidadPlural(unidad) {
  if (unidad === 'bolsa') return 'bolsas'
  if (unidad === 'unidad') return 'unidades'
  return 'kg'
}
function kgAUnidad(kg, producto) {
  if (!producto || producto.unidad === 'kg') return Number(kg || 0)
  return Number(kg || 0) / Number(producto.kg_por_unidad || 1)
}
function fmtUnidad(kg, producto) {
  if (!producto || producto.unidad === 'kg') return fmtKg(kg)
  const cantidad = kgAUnidad(kg, producto)
  return `${cantidad.toFixed(1)} ${unidadPlural(producto.unidad)}`
}
function unidadAKg(cantidadUnidad, producto) {
  if (!producto || producto.unidad === 'kg') return Number(cantidadUnidad || 0)
  return Number(cantidadUnidad || 0) * Number(producto.kg_por_unidad || 1)
}
function redondear(valor, decimales) {
  const factor = 10 ** (decimales ?? 1)
  return Math.round((valor + Number.EPSILON) * factor) / factor
}
function hoyISO() { return new Date().toISOString().slice(0, 10) }
function fechaCorta(iso) {
  if (!iso) return '—'
  const [y, m, d] = iso.split('-')
  return `${d}/${m}/${y}`
}
function addDays(iso, dias) {
  const d = new Date(iso + 'T00:00:00')
  d.setDate(d.getDate() + dias)
  return d.toISOString().slice(0, 10)
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10) }
function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10) }

function calcularRango(preset) {
  const hoy = new Date()
  const hoyIso = hoy.toISOString().slice(0, 10)
  if (preset === '7d') return { desde: addDays(hoyIso, -7), hasta: hoyIso }
  if (preset === '15d') return { desde: addDays(hoyIso, -15), hasta: hoyIso }
  if (preset === 'mes') return { desde: startOfMonth(hoy), hasta: endOfMonth(hoy) }
  if (preset === 'mes_anterior') {
    const mesAnt = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1)
    return { desde: startOfMonth(mesAnt), hasta: endOfMonth(mesAnt) }
  }
  return { desde: addDays(hoyIso, -15), hasta: hoyIso }
}

// ---------------------------------------------------------------------------
// LÓGICA CENTRAL DE CÁLCULO
// (misma lógica que la versión React — ver README para el detalle de cada
// decisión de negocio)
// ---------------------------------------------------------------------------

function aKg(cantidad, unidad, kgPorUnidad) {
  if (unidad === 'kg') return cantidad
  return cantidad * kgPorUnidad
}

function calcularStockEsperado(stockBase, comprasKg, descartesKg) {
  return redondear(stockBase + comprasKg - (descartesKg || 0))
}

function calcularDiferencia(stockFisicoKg, stockEsperadoKg) {
  return redondear(stockFisicoKg - stockEsperadoKg)
}

function calcularConsumoPeriodo(stockInicialPeriodoKg, comprasPeriodoKg, stockFisicoFinalKg) {
  return redondear(stockInicialPeriodoKg + comprasPeriodoKg - stockFisicoFinalKg)
}

function calcularConsumoProductivo(consumoTotalKg, descartesPeriodoKg) {
  return redondear(consumoTotalKg - descartesPeriodoKg)
}

function calcularPorcentajeMerma(descartesKg, consumoTotalKg) {
  if (consumoTotalKg <= 0) return 0
  return redondear((descartesKg / consumoTotalKg) * 100, 2)
}

function calcularCostoPromedioKg(lineas) {
  const validas = lineas.filter((l) => l.costoTotal !== null && l.cantidadKg > 0)
  if (validas.length === 0) return null
  const kgTotales = validas.reduce((acc, l) => acc + l.cantidadKg, 0)
  const costoTotal = validas.reduce((acc, l) => acc + (l.costoTotal || 0), 0)
  if (kgTotales === 0) return null
  return redondear(costoTotal / kgTotales, 2)
}

function bajoStockMinimo(stockActualKg, stockMinimoKg) { return stockActualKg < stockMinimoKg }
function mermaExcedida(porcentajeMerma, porcentajeAceptable) { return porcentajeMerma > porcentajeAceptable }

// ---------------------------------------------------------------------------
// EXPORTAR CSV (sin dependencias)
// ---------------------------------------------------------------------------

function descargarCsv(nombreArchivo, columnas, filas) {
  const escapar = (valor) => {
    const texto = String(valor)
    if (texto.includes(';') || texto.includes('"') || texto.includes('\n')) {
      return `"${texto.replace(/"/g, '""')}"`
    }
    return texto
  }
  const lineas = [columnas.map(escapar).join(';'), ...filas.map((fila) => fila.map(escapar).join(';'))]
  const contenido = '\uFEFF' + lineas.join('\r\n')
  const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' })
  const url = URL.createObjectURL(blob)
  const link = document.createElement('a')
  link.href = url
  link.download = nombreArchivo.endsWith('.csv') ? nombreArchivo : `${nombreArchivo}.csv`
  document.body.appendChild(link)
  link.click()
  document.body.removeChild(link)
  URL.revokeObjectURL(url)
}

  let query = sb.from('molinos').select('*').order('nombre')

async function obtenerStockInicialVigente() {
  const { data, error } = await sb.from('stock_inicial').select('*').eq('vigente', true)
  if (error) throw error
  const mapa = {}
  for (const registro of data) mapa[registro.producto_id] = registro
  return mapa
}

async function existeStockInicialCargado() {
  const { count, error } = await sb
    .from('stock_inicial')
    .select('id', { count: 'exact', head: true })
    .eq('vigente', true)
  if (error) throw error
  return (count || 0) > 0
}

async function guardarStockInicial(productoId, cantidadKg, fecha, motivoModificacion) {
  const { data: vigente } = await sb
    .from('stock_inicial')
    .select('id')
    .eq('producto_id', productoId)
    .eq('vigente', true)
    .maybeSingle()

  if (vigente) {
    const { error: errUpdate } = await sb.from('stock_inicial').update({ vigente: false }).eq('id', vigente.id)
    if (errUpdate) throw errUpdate
  }

  const { error } = await sb.from('stock_inicial').insert({
    producto_id: productoId,
    cantidad_kg: cantidadKg,
    fecha,
    usuario_nombre: usuarioActual(),
    vigente: true,
    motivo_modificacion: motivoModificacion || null,
  })
  if (error) throw error

  await registrarAuditoria(
    'stock_inicial', productoId, vigente ? 'modificar' : 'cargar',
    `Stock inicial: ${cantidadKg} kg${motivoModificacion ? ` — Motivo: ${motivoModificacion}` : ''}`
  )
}

/**
 * Stock actual estimado = base (último conteo físico vigente, o stock
 * inicial si nunca se contó) + compras posteriores - descartes posteriores
 * registrados. Mismo cálculo que "stock esperado" del próximo conteo.
 */
async function obtenerStockActual(productoId, baseStock) {
  if (baseStock.origen === 'sin_datos') return 0

  const { data: compras, error: errCompras } = await sb
    .from('compra_items')
    .select('cantidad_kg, compras!inner(fecha, estado)')
    .eq('producto_id', productoId)
    .gt('compras.fecha', baseStock.fecha)
    .eq('compras.estado', 'activo')
  if (errCompras) throw errCompras

  const { data: descartes, error: errDescartes } = await sb
    .from('descartes')
    .select('cantidad_kg, fecha, estado')
    .eq('producto_id', productoId)
    .gt('fecha', baseStock.fecha)
    .eq('estado', 'activo')
  if (errDescartes) throw errDescartes

  const comprasKg = (compras || []).reduce((acc, c) => acc + Number(c.cantidad_kg), 0)
  const descartesKg = (descartes || []).reduce((acc, d) => acc + Number(d.cantidad_kg), 0)

  return calcularStockEsperado(baseStock.cantidadKg, comprasKg, descartesKg)
}

// ---------------------------------------------------------------------------
// SERVICIOS: COMPRAS

async function listarCompras(filtros) {
  filtros = filtros || {}
  let query = sb
    .from('compras')
    .select('*, molinos(nombre), compra_items(*, productos(nombre, unidad, kg_por_unidad))')
    .order('fecha', { ascending: false })

  if (filtros.molinoId) query = query.eq('molino_id', filtros.molinoId)
  if (filtros.desde) query = query.gte('fecha', filtros.desde)
  if (filtros.hasta) query = query.lte('fecha', filtros.hasta)

  const { data, error } = await query
  if (error) throw error
  let resultado = data
  if (filtros.productoId) {
    resultado = resultado.filter((c) => c.compra_items.some((i) => i.producto_id === filtros.productoId))
  }
  return resultado
}

async function crearCompra(input) {
  const { data: compra, error: errCompra } = await sb
    .from('compras')
    .insert({
      fecha: input.fecha,
      molino_id: input.molino_id,
      observaciones: input.observaciones || null,
      usuario_nombre: usuarioActual(),
      estado: 'activo',
    })
    .select()
    .single()
  if (errCompra) throw errCompra

  const items = input.lineas.map((linea) => {
    const cantidadKg = aKg(linea.cantidad, linea.unidad, linea.kg_por_unidad)
    const costoTotal = linea.costo_unitario != null ? Number((linea.costo_unitario * linea.cantidad).toFixed(2)) : null
    return {
      compra_id: compra.id,
      producto_id: linea.producto_id,
      cantidad: linea.cantidad,
      unidad: linea.unidad,
      cantidad_kg: cantidadKg,
      costo_unitario: linea.costo_unitario ?? null,
      costo_total: costoTotal,
    }
  })

  const { error: errItems } = await sb.from('compra_items').insert(items)
  if (errItems) throw errItems

  const totalKg = items.reduce((acc, i) => acc + i.cantidad_kg, 0)
  await registrarAuditoria('compra', compra.id, 'crear', `Compra registrada: ${totalKg.toFixed(1)} kg en ${items.length} producto(s)`)

  return compra
}

async function anularCompra(id, motivo) {
  const { error } = await sb.from('compras').update({ estado: 'anulado', updated_at: new Date().toISOString() }).eq('id', id)
  if (error) throw error
  await registrarAuditoria('compra', id, 'anular', `Motivo: ${motivo}`)
}

/** Reemplaza fecha/molino/observaciones y TODAS las líneas de una compra existente. */
async function actualizarCompraCompleta(compraId, input) {
  const { error: errCompra } = await sb
    .from('compras')
    .update({
      fecha: input.fecha,
      molino_id: input.molino_id,
      observaciones: input.observaciones || null,
      updated_at: new Date().toISOString(),
    })
    .eq('id', compraId)
  if (errCompra) throw errCompra

  const { error: errDelete } = await sb.from('compra_items').delete().eq('compra_id', compraId)
  if (errDelete) throw errDelete

  const items = input.lineas.map((linea) => {
    const cantidadKg = aKg(linea.cantidad, linea.unidad, linea.kg_por_unidad)
    const costoTotal = linea.costo_unitario != null ? Number((linea.costo_unitario * linea.cantidad).toFixed(2)) : null
    return {
      compra_id: compraId,
      producto_id: linea.producto_id,
      cantidad: linea.cantidad,
      unidad: linea.unidad,
      cantidad_kg: cantidadKg,
      costo_unitario: linea.costo_unitario ?? null,
      costo_total: costoTotal,
    }
  })
  const { error: errItems } = await sb.from('compra_items').insert(items)
  if (errItems) throw errItems

  await registrarAuditoria('compra', compraId, 'editar', 'Compra editada (fecha, molino y/o productos)')
}

/** Borrado definitivo (no queda registro). Los compra_items se borran solos por la relación en cascada. */
async function eliminarCompraDefinitivamente(compraId) {
  const { error } = await sb.from('compras').delete().eq('id', compraId)
  if (error) throw error
  await registrarAuditoria('compra', compraId, 'eliminar', 'Compra eliminada definitivamente')
}

// ---------------------------------------------------------------------------
// SERVICIOS: CONTEOS FÍSICOS
// ---------------------------------------------------------------------------

/**
 * Para cada producto activo determina su base (último conteo vigente o, si
 * nunca se contó, el stock inicial), suma compras y descartes registrados
 * desde esa base, y calcula el stock esperado — lo que se muestra ANTES de
 * que la persona ingrese el stock físico.
 */
async function prepararNuevoConteo() {
  const productos = await listarProductos(true)
  const stockInicialVigente = await obtenerStockInicialVigente()

  const { data: ultimosItems, error } = await sb
    .from('conteo_items')
    .select('producto_id, stock_fisico_kg, conteos!inner(fecha, estado)')
    .eq('conteos.estado', 'activo')
    .order('conteos(fecha)', { ascending: false })
  if (error) throw error

  const baseUltimoConteoPorProducto = {}
  for (const item of ultimosItems || []) {
    if (!baseUltimoConteoPorProducto[item.producto_id]) {
      baseUltimoConteoPorProducto[item.producto_id] = {
        cantidadKg: Number(item.stock_fisico_kg),
        fecha: item.conteos.fecha,
        origen: 'conteo',
      }
    }
  }

  const resultado = []
  for (const producto of productos) {
    const base = baseUltimoConteoPorProducto[producto.id] ||
      (stockInicialVigente[producto.id]
        ? { cantidadKg: Number(stockInicialVigente[producto.id].cantidad_kg), fecha: stockInicialVigente[producto.id].fecha, origen: 'stock_inicial' }
        : { cantidadKg: 0, fecha: '1970-01-01', origen: 'sin_datos' })

    const { data: compras } = await sb
      .from('compra_items')
      .select('cantidad_kg, compras!inner(fecha, estado)')
      .eq('producto_id', producto.id)
      .gt('compras.fecha', base.fecha)
      .eq('compras.estado', 'activo')

    const { data: descartes } = await sb
      .from('descartes')
      .select('cantidad_kg')
      .eq('producto_id', producto.id)
      .gt('fecha', base.fecha)
      .eq('estado', 'activo')

    const comprasKg = (compras || []).reduce((acc, c) => acc + Number(c.cantidad_kg), 0)
    const descartesKg = (descartes || []).reduce((acc, d) => acc + Number(d.cantidad_kg), 0)

    resultado.push({
      producto, base, comprasPeriodoKg: comprasKg, descartesPeriodoKg: descartesKg,
      stockEsperadoKg: calcularStockEsperado(base.cantidadKg, comprasKg, descartesKg),
    })
  }
  return resultado
}

async function crearConteo(fecha, observaciones, items) {
  const preparado = await prepararNuevoConteo()
  const mapaPreparado = new Map(preparado.map((p) => [p.producto.id, p]))

  const { data: ultimoConteo } = await sb
    .from('conteos')
    .select('fecha')
    .eq('estado', 'activo')
    .order('fecha', { ascending: false })
    .limit(1)
    .maybeSingle()

  const { data: conteo, error: errConteo } = await sb
    .from('conteos')
    .insert({
      fecha,
      periodo_inicio: ultimoConteo?.fecha ?? fecha,
      observaciones: observaciones || null,
      usuario_nombre: usuarioActual(),
      estado: 'activo',
    })
    .select()
    .single()
  if (errConteo) throw errConteo

  const filasItems = items.map((item) => {
    const prep = mapaPreparado.get(item.producto_id)
    const base = prep ? prep.base.cantidadKg : 0
    const compras = prep ? prep.comprasPeriodoKg : 0
    const stockEsperado = prep ? prep.stockEsperadoKg : 0
    const consumoCalculado = calcularConsumoPeriodo(base, compras, item.stock_fisico_kg)
    return {
      conteo_id: conteo.id,
      producto_id: item.producto_id,
      stock_esperado_kg: stockEsperado,
      stock_fisico_kg: item.stock_fisico_kg,
      diferencia_kg: calcularDiferencia(item.stock_fisico_kg, stockEsperado),
      consumo_calculado_kg: consumoCalculado,
      motivo_diferencia_id: item.motivo_diferencia_id || null,
      observacion_diferencia: item.observacion_diferencia || null,
    }
  })

  const { error: errItems } = await sb.from('conteo_items').insert(filasItems)
  if (errItems) throw errItems

  await registrarAuditoria('conteo', conteo.id, 'crear', `Conteo realizado con ${filasItems.length} producto(s)`)
  return conteo
}

async function obtenerResumen(filtros) {
  const todosLosProductos = await listarProductos(true)
  let productos = filtros.productoId ? todosLosProductos.filter((p) => p.id === filtros.productoId) : todosLosProductos
  if (filtros.molinoId) productos = productos.filter((p) => p.molino_id === filtros.molinoId)

  const stockInicialVigente = await obtenerStockInicialVigente()
  const config = await obtenerConfiguracion()
  const umbralMerma = Number(config[CLAVES_CONFIG.UMBRAL_MERMA_PORCENTAJE] || 5)

  const resultado = []
  for (const producto of productos) {
    const stockIni = stockInicialVigente[producto.id]
    const base = stockIni
      ? { cantidadKg: Number(stockIni.cantidad_kg), fecha: stockIni.fecha, origen: 'stock_inicial' }
      : { cantidadKg: 0, fecha: '1970-01-01', origen: 'sin_datos' }

    const stockActualKg = await obtenerStockActual(producto.id, base)

    const { data: compras } = await sb
      .from('compra_items')
      .select('cantidad_kg, compras!inner(fecha, molino_id, estado)')
      .eq('producto_id', producto.id)
      .eq('compras.estado', 'activo')
      .gte('compras.fecha', filtros.desde)
      .lte('compras.fecha', filtros.hasta)

    const { data: conteoItems } = await sb
      .from('conteo_items')
      .select('consumo_calculado_kg, diferencia_kg, conteos!inner(fecha, estado)')
      .eq('producto_id', producto.id)
      .eq('conteos.estado', 'activo')
      .gte('conteos.fecha', filtros.desde)
      .lte('conteos.fecha', filtros.hasta)

    const { data: descartes } = await sb
      .from('descartes')
      .select('cantidad_kg')
      .eq('producto_id', producto.id)
      .eq('estado', 'activo')
      .gte('fecha', filtros.desde)
      .lte('fecha', filtros.hasta)

    const comprasKg = (compras || []).reduce((acc, c) => acc + Number(c.cantidad_kg), 0)
    const consumoTotalKg = (conteoItems || []).reduce((acc, c) => acc + Number(c.consumo_calculado_kg), 0)
    const diferenciaKg = (conteoItems || []).reduce((acc, c) => acc + Number(c.diferencia_kg), 0)
    const descartesKg = (descartes || []).reduce((acc, d) => acc + Number(d.cantidad_kg), 0)
    const mermaPorcentaje = calcularPorcentajeMerma(descartesKg, consumoTotalKg)

    resultado.push({
      producto, stockActualKg, comprasKg, consumoTotalKg, descartesKg, mermaPorcentaje, diferenciaKg,
      bajoMinimo: bajoStockMinimo(stockActualKg, producto.stock_minimo),
      mermaExcedida: mermaExcedida(mermaPorcentaje, producto.porcentaje_merma_aceptable || umbralMerma),
    })
  }
  return resultado
}

async function obtenerEvolucionProducto(productoId) {
  const { data, error } = await sb
    .from('conteo_items')
    .select('stock_fisico_kg, consumo_calculado_kg, diferencia_kg, conteos!inner(fecha, estado)')
    .eq('producto_id', productoId)

  }))
}

]

let estadoDashboard = { preset: '15d', molinoId: '' }

async function renderDashboard(contenedor) {
  contenedor.innerHTML = `<p class="text-sm text-crust-600">Cargando…</p>`

  const [molinos, faltaInicial] = await Promise.all([listarMolinos(true), faltaConfiguracionInicial()])
  const { desde, hasta } = calcularRango(estadoDashboard.preset)
  const resumen = await obtenerResumen({ desde, hasta, molinoId: estadoDashboard.molinoId || undefined })
  const fechaHoy = fechaCorta(hoyISO())

  const totalStockBolsas = resumen.reduce((acc, r) => acc + kgAUnidad(r.stockActualKg, r.producto), 0)
  const totalComprasBolsas = resumen.reduce((acc, r) => acc + kgAUnidad(r.comprasKg, r.producto), 0)
  const totalConsumoBolsas = resumen.reduce((acc, r) => acc + kgAUnidad(r.consumoTotalKg, r.producto), 0)
  const alertas = resumen.filter((r) => r.bajoMinimo)

  const molinosConDatos = Array.from(new Set(resumen.map((r) => r.producto.molino_nombre)))

  contenedor.innerHTML = `
    <div class="space-y-6">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <h1 class="font-display text-2xl font-semibold text-crust-900">Panel general</h1>
          <p class="text-sm text-crust-600 mt-1">Stock, compras y consumo de harina.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="#/compras" class="btn-primary">+ Registrar compra</a>
          <a href="#/conteos/nuevo" class="btn-secondary">+ Nuevo conteo</a>
          <a href="#/reportes" class="btn-secondary">Ver reportes</a>
        </div>
      </div>

      ${faltaInicial ? `
        <div class="card p-4 bg-wheat-500/10 border-wheat-500/40 flex items-center justify-between gap-4 flex-wrap">
          <p class="text-sm text-crust-800"><strong>Falta cargar el stock inicial</strong> de uno o más productos. Hasta que lo cargues, sus cálculos de stock y consumo no van a ser confiables.</p>
          <a href="#/administracion/stock-inicial" class="btn-primary shrink-0">Configurar stock inicial</a>
        </div>` : ''}

      <div class="flex flex-wrap gap-2 items-center">
        ${PRESETS_DASHBOARD.map((p) => `
          <button data-preset="${p.value}" class="btn-preset ${estadoDashboard.preset === p.value ? 'btn-primary' : 'btn-secondary'} !py-1.5 !px-3 text-xs">${p.label}</button>
        `).join('')}
        <select id="dash-molino" class="input !w-auto text-xs py-1.5">
          <option value="">Todos los molinos</option>
          ${molinos.map((m) => `<option value="${m.id}" ${estadoDashboard.molinoId === m.id ? 'selected' : ''}>${escapeHtml(m.nombre)}</option>`).join('')}
        </select>
      </div>

      ${alertas.length > 0 ? `
        <div class="card p-4 border-l-4 border-rust-500/50 bg-rust-500/5">
          <p class="text-sm font-semibold text-rust-600 mb-1.5">Alertas activas</p>
          <ul class="text-sm text-crust-800 space-y-1">
            ${alertas.map((a) => `
              <li><strong>${escapeHtml(a.producto.nombre)}</strong> está bajo el stock mínimo (${fmtUnidad(a.stockActualKg, a.producto)} de ${fmtUnidad(a.producto.stock_minimo, a.producto)}).</li>
            `).join('')}
          </ul>
        </div>` : ''}

      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        ${statCard(`Stock actual (al ${fechaHoy})`, `${totalStockBolsas.toFixed(1)} bolsas`, 'neutral')}
        ${statCard('Compras del período', `${totalComprasBolsas.toFixed(1)} bolsas`, 'ok')}
        ${statCard('Consumo del período', `${totalConsumoBolsas.toFixed(1)} bolsas`, 'neutral')}
      </div>

      <div>
        <h2 class="font-display text-lg font-semibold text-crust-900 mb-3">Resumen por molino y producto</h2>
        ${resumen.length === 0 ? emptyState('Todavía no hay datos para este período', 'Registrá una compra o hacé el primer conteo para empezar a ver indicadores acá.') : `
          <div class="space-y-5">
            ${molinosConDatos.map((nombreMolino) => `
              <div class="card overflow-hidden">
                <div class="px-4 py-3 border-b border-crust-800/10 bg-flour-100/60">
                  <p class="font-display font-semibold text-crust-900">${escapeHtml(nombreMolino)}</p>
                </div>
                <table class="w-full table-clean">
                  <thead><tr><th class="pl-4">Producto</th><th>Stock actual (al ${fechaHoy})</th><th>Compras</th><th>Consumo</th><th class="pr-4">Estado</th></tr></thead>
                  <tbody>
                    ${resumen.filter((r) => r.producto.molino_nombre === nombreMolino).map((r) => `
                      <tr>
                        <td class="pl-4"><a href="#/reportes/${r.producto.id}" class="font-medium text-crust-900 hover:underline">${escapeHtml(r.producto.nombre)}</a></td>
                        <td>${fmtUnidad(r.stockActualKg, r.producto)}</td>
                        <td>${fmtUnidad(r.comprasKg, r.producto)}</td>
                        <td>${fmtUnidad(r.consumoTotalKg, r.producto)}</td>
                        <td class="pr-4">${r.bajoMinimo ? '<span class="badge-danger">Bajo mínimo</span>' : '<span class="badge-ok">OK</span>'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `

  qsa('.btn-preset', contenedor).forEach((btn) => {
    btn.addEventListener('click', () => {
      estadoDashboard.preset = btn.dataset.preset
      renderDashboard(contenedor)
    })
  })
  qs('#dash-molino', contenedor).addEventListener('change', (e) => {
    estadoDashboard.molinoId = e.target.value
    renderDashboard(contenedor)
  })
}

function statCard(label, value, tone) {
  const toneClass = { neutral: 'border-crust-800/10', ok: 'border-sage-500/30', warn: 'border-wheat-500/40', danger: 'border-rust-500/40' }[tone] || ''
  return `
    <div class="card p-4 border-l-4 ${toneClass}">
      <p class="text-xs font-semibold uppercase tracking-wide text-crust-600">${escapeHtml(label)}</p>
      <p class="font-display text-2xl font-semibold text-crust-900 mt-1.5">${escapeHtml(value)}</p>
    </div>
  `
}

function emptyState(titulo, descripcion) {
  return `
    <div class="card p-10 text-center">
      <p class="font-display text-lg font-semibold text-crust-800">${escapeHtml(titulo)}</p>
      <p class="text-sm text-crust-600 mt-1.5 max-w-md mx-auto">${escapeHtml(descripcion)}</p>
    </div>
  `
}

let estadoCompras = { filtroMolino: '', mostrarForm: false, compraEnEdicion: null, lineas: [{ producto_id: '', cantidad: '', unidad: 'bolsa', costo_unitario: '' }] }

async function renderCompras(contenedor) {
  contenedor.innerHTML = `<p class="text-sm text-crust-600">Cargando…</p>`
  const [molinos, productos, compras] = await Promise.all([
    listarMolinos(true), listarProductos(true), listarCompras({ molinoId: estadoCompras.filtroMolino || undefined }),
  ])

  contenedor.innerHTML = `
    <div class="space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="font-display text-2xl font-semibold text-crust-900">Compras</h1>
          <p class="text-sm text-crust-600 mt-1">Registrá cada entrada de harina por molino.</p>
        </div>
        <button id="btn-nueva-compra" class="btn-primary">+ Registrar compra</button>
      </div>

      <div id="form-compra-container"></div>

      <div class="flex gap-2 items-center flex-wrap">
        <select id="compras-filtro-molino" class="input !w-auto text-sm">
          <option value="">Todos los molinos</option>
          ${molinos.map((m) => `<option value="${m.id}" ${estadoCompras.filtroMolino === m.id ? 'selected' : ''}>${escapeHtml(m.nombre)}</option>`).join('')}
        </select>
        <button id="btn-csv-compras" class="btn-secondary text-sm" ${compras.length === 0 ? 'disabled' : ''}>Descargar CSV</button>
      </div>

      ${compras.length === 0 ? emptyState('Todavía no hay compras registradas', 'Usá el botón de arriba para cargar la primera.') : `
        <div class="card overflow-x-auto">
          <table class="w-full table-clean min-w-[720px]">
            <thead><tr><th class="pl-4">Fecha</th><th>Molino</th><th>Productos</th><th>Costo</th><th class="pr-4">Estado</th></tr></thead>
            <tbody>
              ${compras.map((c) => {
                const costoTotal = c.compra_items.reduce((a, i) => a + (i.costo_total || 0), 0)
                const detalle = c.compra_items.map((i) => `${i.productos.nombre}: ${fmtUnidad(Number(i.cantidad_kg), i.productos)}`).join(', ')
                return `
                  <tr class="${c.estado === 'anulado' ? 'opacity-40' : ''}">
                    <td class="pl-4">${fechaCorta(c.fecha)}</td>
                    <td>${escapeHtml(c.molinos?.nombre || '')}</td>
                    <td>${escapeHtml(detalle)}</td>
                    <td>${costoTotal > 0 ? fmtMoney(costoTotal) : '—'}</td>
                    <td class="pr-4 space-x-2 whitespace-nowrap">
                      ${c.estado === 'anulado' ? '<span class="badge-neutral">Anulada</span>' : `
                        <button class="btn-editar-compra text-xs text-crust-500 hover:text-crust-800" data-id="${c.id}">Editar</button>
                        <button class="btn-anular-compra text-xs text-rust-600 hover:underline" data-id="${c.id}">Anular</button>
                      `}
                      <button class="btn-eliminar-compra text-xs text-rust-600 hover:underline" data-id="${c.id}">Eliminar</button>
                    </td>
                  </tr>
                `
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `

  if (estadoCompras.mostrarForm) renderFormCompra(contenedor, molinos, productos, estadoCompras.compraEnEdicion)

  qs('#btn-nueva-compra', contenedor).addEventListener('click', () => {
    estadoCompras.mostrarForm = true
    estadoCompras.compraEnEdicion = null
    estadoCompras.lineas = [{ producto_id: '', cantidad: '', unidad: 'bolsa', costo_unitario: '' }]
    renderCompras(contenedor)
  })
  qs('#compras-filtro-molino', contenedor).addEventListener('change', (e) => {
    estadoCompras.filtroMolino = e.target.value
    renderCompras(contenedor)
  })
  qs('#btn-csv-compras', contenedor)?.addEventListener('click', () => {
    descargarCsv('historial-compras',
      ['Fecha', 'Molino', 'Productos', 'Costo', 'Estado', 'Observaciones'],
      compras.map((c) => [
        c.fecha, c.molinos?.nombre || '',
        c.compra_items.map((i) => `${i.productos.nombre}: ${fmtUnidad(Number(i.cantidad_kg), i.productos)}`).join(', '),
        c.compra_items.reduce((a, i) => a + (i.costo_total || 0), 0).toFixed(0),
        c.estado, c.observaciones || '',
      ]))
  })
  qsa('.btn-editar-compra', contenedor).forEach((btn) => {
    btn.addEventListener('click', () => {
      const compra = compras.find((c) => c.id === btn.dataset.id)
      estadoCompras.mostrarForm = true
      estadoCompras.compraEnEdicion = compra
      estadoCompras.molinoId = compra.molino_id
      estadoCompras.lineas = compra.compra_items.map((i) => ({
        producto_id: i.producto_id, cantidad: String(i.cantidad), unidad: i.unidad,
        costo_unitario: i.costo_unitario != null ? String(i.costo_unitario) : '',
      }))
      renderCompras(contenedor)
    })
  })
  qsa('.btn-anular-compra', contenedor).forEach((btn) => {
    btn.addEventListener('click', async () => {
      const motivo = window.prompt('Motivo de la anulación:')
      if (motivo === null) return
      await anularCompra(btn.dataset.id, motivo || 'Sin especificar')
      renderCompras(contenedor)
    })
  })
  qsa('.btn-eliminar-compra', contenedor).forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!window.confirm('¿Eliminar esta compra definitivamente? No se puede deshacer y no va a quedar ningún registro de ella.')) return
      if (!window.confirm('Confirmá de nuevo: esto la borra para siempre, a diferencia de "Anular". ¿Seguro?')) return
      await eliminarCompraDefinitivamente(btn.dataset.id)
      renderCompras(contenedor)
    })
  })
}

function renderFormCompra(contenedor, molinos, productos, compraEnEdicion) {
  const cont = qs('#form-compra-container', contenedor)
  const molinoId = estadoCompras.molinoId || molinos[0]?.id || ''
  const productosDelMolino = productos.filter((p) => p.molino_id === molinoId)

  cont.innerHTML = `
    <div class="card p-5 space-y-4">
      <p class="font-display font-semibold text-lg text-crust-900">${compraEnEdicion ? 'Editar compra' : 'Nueva compra'}</p>
      <div class="grid md:grid-cols-3 gap-3">
        <div><label class="label">Fecha</label><input type="date" id="fc-fecha" class="input" value="${compraEnEdicion ? compraEnEdicion.fecha : hoyISO()}" /></div>
        <div>
          <label class="label">Molino</label>
          <select id="fc-molino" class="input">
            ${molinos.map((m) => `<option value="${m.id}" ${molinoId === m.id ? 'selected' : ''}>${escapeHtml(m.nombre)}</option>`).join('')}
          </select>
        </div>
        <div><label class="label">Observaciones (opcional)</label><input id="fc-obs" class="input" value="${escapeHtml(compraEnEdicion?.observaciones || '')}" /></div>
      </div>
      <div class="space-y-2">
        <label class="label">Productos comprados</label>
        <div id="fc-lineas"></div>
        <button id="fc-agregar-linea" type="button" class="text-sm text-wheat-600 font-semibold hover:underline">+ Agregar producto</button>
      </div>
      <p id="fc-error" class="text-sm text-rust-600 hidden"></p>
      <div class="flex gap-2 justify-end pt-2 border-t border-crust-800/10">
        <button id="fc-cancelar" type="button" class="btn-secondary">Cancelar</button>
        <button id="fc-guardar" type="button" class="btn-primary">${compraEnEdicion ? 'Guardar cambios' : 'Guardar compra'}</button>
      </div>
    </div>
  `

  function pintarLineas() {
    const lineasEl = qs('#fc-lineas', cont)
    const molinoSel = qs('#fc-molino', cont).value
    const productosOpciones = productos.filter((p) => p.molino_id === molinoSel)
    lineasEl.innerHTML = estadoCompras.lineas.map((linea, idx) => {
      const producto = productosOpciones.find((p) => p.id === linea.producto_id)
      const kg = producto && linea.cantidad ? Number(linea.cantidad) * producto.kg_por_unidad : null
      return `
        <div class="grid grid-cols-12 gap-2 items-center linea-compra" data-idx="${idx}">
          <select class="input col-span-4 fc-producto">
            <option value="">Producto…</option>
            ${productosOpciones.map((p) => `<option value="${p.id}" ${linea.producto_id === p.id ? 'selected' : ''}>${escapeHtml(p.nombre)}</option>`).join('')}
          </select>
          <input type="number" min="0" placeholder="Cantidad" class="input col-span-2 fc-cantidad" value="${escapeHtml(linea.cantidad)}" />
          <select class="input col-span-2 fc-unidad">
            <option value="bolsa" ${linea.unidad === 'bolsa' ? 'selected' : ''}>bolsa</option>
            <option value="kg" ${linea.unidad === 'kg' ? 'selected' : ''}>kg</option>
            <option value="unidad" ${linea.unidad === 'unidad' ? 'selected' : ''}>unidad</option>
          </select>
          <input type="number" min="0" placeholder="Precio unit. (opc.)" class="input col-span-3 fc-costo" value="${escapeHtml(linea.costo_unitario)}" />
          <button type="button" class="col-span-1 text-crust-400 hover:text-rust-600 text-sm fc-quitar">✕</button>
          ${kg !== null ? `<p class="col-span-12 text-xs text-crust-500 -mt-1.5 ml-1">= ${kg.toFixed(1)} kg</p>` : ''}
        </div>
      `
    }).join('')

    qsa('.linea-compra', lineasEl).forEach((div) => {
      const idx = Number(div.dataset.idx)
      qs('.fc-producto', div).addEventListener('change', (e) => { estadoCompras.lineas[idx].producto_id = e.target.value; pintarLineas() })
      qs('.fc-cantidad', div).addEventListener('input', (e) => { estadoCompras.lineas[idx].cantidad = e.target.value; pintarLineas() })
      qs('.fc-unidad', div).addEventListener('change', (e) => { estadoCompras.lineas[idx].unidad = e.target.value })
      qs('.fc-costo', div).addEventListener('input', (e) => { estadoCompras.lineas[idx].costo_unitario = e.target.value })
      qs('.fc-quitar', div).addEventListener('click', () => {
        estadoCompras.lineas = estadoCompras.lineas.filter((_, i) => i !== idx)
        pintarLineas()
      })
    })
  }
  pintarLineas()

  qs('#fc-molino', cont).addEventListener('change', () => {
    estadoCompras.molinoId = qs('#fc-molino', cont).value
    estadoCompras.lineas = [{ producto_id: '', cantidad: '', unidad: 'bolsa', costo_unitario: '' }]
    pintarLineas()
  })
  qs('#fc-agregar-linea', cont).addEventListener('click', () => {
    estadoCompras.lineas.push({ producto_id: '', cantidad: '', unidad: 'bolsa', costo_unitario: '' })
    pintarLineas()
  })
  qs('#fc-cancelar', cont).addEventListener('click', () => {
    estadoCompras.mostrarForm = false
    estadoCompras.compraEnEdicion = null
    renderCompras(contenedor)
  })
  qs('#fc-guardar', cont).addEventListener('click', async () => {
    const errorEl = qs('#fc-error', cont)
    errorEl.classList.add('hidden')
    const fecha = qs('#fc-fecha', cont).value
    const molino = qs('#fc-molino', cont).value
    const observaciones = qs('#fc-obs', cont).value
    const lineasValidas = estadoCompras.lineas.filter((l) => l.producto_id && Number(l.cantidad) > 0)

    if (!molino) { errorEl.textContent = 'Elegí un molino.'; errorEl.classList.remove('hidden'); return }
    if (lineasValidas.length === 0) { errorEl.textContent = 'Agregá al menos un producto con cantidad mayor a 0.'; errorEl.classList.remove('hidden'); return }

    const btnGuardar = qs('#fc-guardar', cont)
    btnGuardar.disabled = true
    btnGuardar.textContent = 'Guardando…'
    try {
      const input = {
        fecha, molino_id: molino, observaciones,
        lineas: lineasValidas.map((l) => {
          const producto = productos.find((p) => p.id === l.producto_id)
          return { producto_id: l.producto_id, cantidad: Number(l.cantidad), unidad: l.unidad, kg_por_unidad: producto.kg_por_unidad, costo_unitario: l.costo_unitario ? Number(l.costo_unitario) : null }
        }),
      }
      if (compraEnEdicion) await actualizarCompraCompleta(compraEnEdicion.id, input)
      else await crearCompra(input)
      estadoCompras.mostrarForm = false
      estadoCompras.compraEnEdicion = null
      renderCompras(contenedor)
    } catch (err) {
      console.error(err)
      errorEl.textContent = 'No se pudo guardar la compra. Intentá de nuevo.'
      errorEl.classList.remove('hidden')
      btnGuardar.disabled = false
      btnGuardar.textContent = compraEnEdicion ? 'Guardar cambios' : 'Guardar compra'
    }
  })
}

  qsa('.btn-toggle-conteo', contenedor).forEach((btn) => {

      expandidoConteo = expandidoConteo === btn.dataset.id ? null : btn.dataset.id
      renderConteos(contenedor)
    })
  })
  qs('#btn-csv-conteos', contenedor)?.addEventListener('click', () => {
    const filas = conteos.flatMap((c) => c.conteo_items.map((i) => [
      c.fecha, c.periodo_inicio, i.productos.nombre,
      fmtUnidad(i.stock_fisico_kg, i.productos), fmtUnidad(i.consumo_calculado_kg, i.productos), c.estado,
    ]))
    descargarCsv('historial-conteos', ['Fecha conteo', 'Inicio período', 'Producto', 'Contado', 'Consumo', 'Estado'], filas)
  })
  qsa('.btn-anular-conteo', contenedor).forEach((btn) => {
    btn.addEventListener('click', async () => {
      const motivo = window.prompt('Motivo de la anulación de este conteo:')
      if (motivo === null) return
      await anularConteo(btn.dataset.id, motivo || 'Sin especificar')
      renderConteos(contenedor)
    })
  })
}

let estadoNuevoConteo = null // se resetea cada vez que se entra a la vista

async function renderNuevoConteo(contenedor) {
  contenedor.innerHTML = `<p class="text-sm text-crust-600">Cargando productos…</p>`
  const items = await prepararNuevoConteo()

  estadoNuevoConteo = {
    items,
    valores: {},
    fecha: hoyISO(), observaciones: '', paso: 'carga',
  }

  if (items.length === 0) {
    contenedor.innerHTML = emptyState('No hay productos activos para contar', 'Cargá al menos un producto activo desde Administración antes de hacer un conteo.')
    return
  }

  pintarNuevoConteo(contenedor)
}

function pintarNuevoConteo(contenedor) {
  const st = estadoNuevoConteo
  const molinos = Array.from(new Set(st.items.map((i) => i.producto.molino_nombre)))

  if (st.paso === 'carga') {
    contenedor.innerHTML = `
      <div class="space-y-6 max-w-2xl">
        <div>
          <h1 class="font-display text-2xl font-semibold text-crust-900">Nuevo conteo</h1>
          <p class="text-sm text-crust-600 mt-1">Contá la harina física de cada producto y cargá la cantidad en bolsas.</p>
        </div>
        <div class="card p-4">
          <label class="label">Fecha del conteo</label>
          <input type="date" id="nc-fecha" class="input max-w-[200px]" value="${st.fecha}" />
        </div>
        ${molinos.map((nombreMolino) => `
          <div class="card overflow-hidden">
            <div class="px-4 py-3 border-b border-crust-800/10 bg-flour-100/60"><p class="font-display font-semibold text-crust-900">${escapeHtml(nombreMolino)}</p></div>
            <div class="divide-y divide-crust-800/10">
              ${st.items.filter((i) => i.producto.molino_nombre === nombreMolino).map((i) => `
                <div class="px-4 py-3.5 flex items-center justify-between gap-4">
                  <div class="min-w-0">
                    <p class="font-medium text-crust-900 truncate">${escapeHtml(i.producto.nombre)}</p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <input type="number" inputmode="decimal" min="0" placeholder="0" class="input w-28 text-lg text-right font-semibold py-3 nc-valor" data-id="${i.producto.id}" value="${st.valores[i.producto.id] || ''}" />
                    <span class="text-sm text-crust-500">${unidadPlural(i.producto.unidad)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
        <div class="card p-4">
          <label class="label">Observaciones generales (opcional)</label>
          <textarea id="nc-obs" class="input" rows="2">${escapeHtml(st.observaciones)}</textarea>
        </div>
        <p id="nc-error" class="text-sm text-rust-600 hidden"></p>
        <div class="flex justify-end gap-2">
          <a href="#/conteos" class="btn-secondary">Cancelar</a>
          <button id="nc-continuar" class="btn-primary">Continuar</button>
        </div>
      </div>
    `
    qsa('.nc-valor', contenedor).forEach((input) => {
      input.addEventListener('input', (e) => { st.valores[e.target.dataset.id] = e.target.value })
    })
    qs('#nc-fecha', contenedor).addEventListener('change', (e) => { st.fecha = e.target.value })
    qs('#nc-obs', contenedor).addEventListener('input', (e) => { st.observaciones = e.target.value })
    qs('#nc-continuar', contenedor).addEventListener('click', () => {
      const errorEl = qs('#nc-error', contenedor)
      if (st.items.some((i) => !st.valores[i.producto.id])) {
        errorEl.textContent = 'Ingresá la cantidad de todos los productos antes de continuar.'
        errorEl.classList.remove('hidden')
        return
      }
      st.paso = 'resumen'
      pintarNuevoConteo(contenedor)
    })
    return
  }

  // paso === 'resumen'
  contenedor.innerHTML = `
    <div class="space-y-6 max-w-2xl">
      <div>
        <h1 class="font-display text-2xl font-semibold text-crust-900">Confirmar conteo</h1>
        <p class="text-sm text-crust-600 mt-1">Esto es lo que se consumió desde el último conteo, calculado solo.</p>
      </div>
      <div class="card divide-y divide-crust-800/10">
        ${st.items.map((i) => {
          const fisicoUnidad = Number(st.valores[i.producto.id])
          const fisicoKg = unidadAKg(fisicoUnidad, i.producto)
          const consumoKg = calcularConsumoPeriodo(i.base.cantidadKg, i.comprasPeriodoKg, fisicoKg)
          return `
            <div class="px-4 py-3.5 flex items-center justify-between gap-4">
              <div>
                <p class="font-medium text-crust-900">${escapeHtml(i.producto.nombre)}</p>
                <p class="text-xs text-crust-500 mt-0.5">Contaste: ${fmtUnidad(fisicoKg, i.producto)}</p>
              </div>
              <span class="badge-neutral">Consumo: ${fmtUnidad(consumoKg, i.producto)}</span>
            </div>
          `
        }).join('')}
      </div>
      <p id="nc-error2" class="text-sm text-rust-600 hidden"></p>
      <div class="flex justify-end gap-2">
        <button id="nc-volver" class="btn-secondary">Volver</button>
        <button id="nc-confirmar" class="btn-primary">Confirmar conteo</button>
      </div>
    </div>
  `
  qs('#nc-volver', contenedor).addEventListener('click', () => { st.paso = 'carga'; pintarNuevoConteo(contenedor) })
  qs('#nc-confirmar', contenedor).addEventListener('click', async () => {
    const errorEl = qs('#nc-error2', contenedor)
    const btn = qs('#nc-confirmar', contenedor)
    btn.disabled = true
    btn.textContent = 'Guardando…'
    try {
      const itemsInput = st.items.map((i) => ({
        producto_id: i.producto.id,
        stock_fisico_kg: unidadAKg(Number(st.valores[i.producto.id]), i.producto),
      }))
      await crearConteo(st.fecha, st.observaciones || undefined, itemsInput)
      irA('conteos')
    } catch (err) {
      console.error(err)
      errorEl.textContent = 'No se pudo guardar el conteo. Intentá de nuevo.'
      errorEl.classList.remove('hidden')
      btn.disabled = false
      btn.textContent = 'Confirmar conteo'
    }
  })
}

let estadoDescartes = { mostrarForm: false }

async function renderDescartes(contenedor) {
  contenedor.innerHTML = `<p class="text-sm text-crust-600">Cargando…</p>`
  const [productos, motivos, descartes] = await Promise.all([listarProductos(true), listarMotivosDescarte(true), listarDescartes()])

  contenedor.innerHTML = `
    <div class="space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="font-display text-2xl font-semibold text-crust-900">Descartes</h1>
          <p class="text-sm text-crust-600 mt-1">Registrá la harina que se descarta a medida que ocurre. No hace falta esperar al conteo.</p>
        </div>
        <div class="flex gap-2">
          <button id="btn-csv-descartes" class="btn-secondary" ${descartes.length === 0 ? 'disabled' : ''}>Descargar CSV</button>
          <button id="btn-nuevo-descarte" class="btn-primary">+ Registrar descarte</button>
        </div>
      </div>

      <div id="form-descarte-container"></div>

      ${descartes.length === 0 ? emptyState('Todavía no hay descartes registrados', 'Usá el botón de arriba cuando ocurra uno.') : `
        <div class="card overflow-x-auto">
          <table class="w-full table-clean min-w-[640px]">
            <thead><tr><th class="pl-4">Fecha</th><th>Producto</th><th>Cantidad</th><th>Motivo</th><th>Observaciones</th><th class="pr-4">Estado</th></tr></thead>
            <tbody>
              ${descartes.map((d) => `
                <tr class="${d.estado === 'anulado' ? 'opacity-40' : ''}">
                  <td class="pl-4">${fechaCorta(d.fecha)}</td>
                  <td>${escapeHtml(d.productos.nombre)}</td>
                  <td>${fmtKg1(d.cantidad_kg)}</td>
                  <td>${escapeHtml(d.motivos_descarte.nombre)}</td>
                  <td class="text-crust-600">${escapeHtml(d.observaciones || '—')}</td>
                  <td class="pr-4">${d.estado === 'anulado' ? '<span class="badge-neutral">Anulado</span>' : `<button class="btn-anular-descarte text-xs text-rust-600 hover:underline" data-id="${d.id}">Anular</button>`}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `

  if (estadoDescartes.mostrarForm) renderFormDescarte(contenedor, productos, motivos)

  qs('#btn-nuevo-descarte', contenedor).addEventListener('click', () => {
    estadoDescartes.mostrarForm = true
    renderDescartes(contenedor)
  })
  qs('#btn-csv-descartes', contenedor)?.addEventListener('click', () => {
    descargarCsv('historial-descartes', ['Fecha', 'Producto', 'Cantidad (kg)', 'Motivo', 'Observaciones', 'Estado'],
      descartes.map((d) => [d.fecha, d.productos.nombre, Number(d.cantidad_kg).toFixed(1), d.motivos_descarte.nombre, d.observaciones || '', d.estado]))
  })
  qsa('.btn-anular-descarte', contenedor).forEach((btn) => {
    btn.addEventListener('click', async () => {
      const motivo = window.prompt('Motivo de la anulación:')
      if (motivo === null) return
      await anularDescarte(btn.dataset.id, motivo || 'Sin especificar')
      renderDescartes(contenedor)
    })
  })
}

function renderFormDescarte(contenedor, productos, motivos) {
  const cont = qs('#form-descarte-container', contenedor)
  cont.innerHTML = `
    <div class="card p-5 space-y-4 max-w-xl">
      <p class="font-display font-semibold text-lg text-crust-900">Registrar descarte</p>
      <div class="grid md:grid-cols-2 gap-3">
        <div><label class="label">Fecha</label><input type="date" id="fd-fecha" class="input" value="${hoyISO()}" /></div>
        <div>
          <label class="label">Producto</label>
          <select id="fd-producto" class="input">
            <option value="">Elegir…</option>
            ${productos.map((p) => `<option value="${p.id}">${escapeHtml(p.molino_nombre)} — ${escapeHtml(p.nombre)}</option>`).join('')}
          </select>
        </div>
        <div><label class="label">Cantidad</label><input type="number" min="0" id="fd-cantidad" class="input" /></div>
        <div>
          <label class="label">Unidad</label>
          <select id="fd-unidad" class="input">
            <option value="kg">kg</option><option value="bolsa">bolsa</option><option value="unidad">unidad</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="label">Motivo</label>
          <select id="fd-motivo" class="input">
            <option value="">Elegir…</option>
            ${motivos.map((m) => `<option value="${m.id}">${escapeHtml(m.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="md:col-span-2"><label class="label">Observaciones (opcional)</label><input id="fd-obs" class="input" /></div>
      </div>
      <p id="fd-error" class="text-sm text-rust-600 hidden"></p>
      <div class="flex gap-2 justify-end pt-2 border-t border-crust-800/10">
        <button id="fd-cancelar" type="button" class="btn-secondary">Cancelar</button>
        <button id="fd-guardar" type="button" class="btn-primary">Guardar descarte</button>
      </div>
    </div>
  `
  qs('#fd-cancelar', cont).addEventListener('click', () => { estadoDescartes.mostrarForm = false; renderDescartes(contenedor) })
  qs('#fd-guardar', cont).addEventListener('click', async () => {
    const errorEl = qs('#fd-error', cont)
    errorEl.classList.add('hidden')
    const productoId = qs('#fd-producto', cont).value
    const cantidad = qs('#fd-cantidad', cont).value
    const unidad = qs('#fd-unidad', cont).value
    const motivoId = qs('#fd-motivo', cont).value
    const observaciones = qs('#fd-obs', cont).value
    const producto = productos.find((p) => p.id === productoId)

    if (!productoId || !motivoId || !(Number(cantidad) > 0)) {
      errorEl.textContent = 'Completá producto, cantidad y motivo.'
      errorEl.classList.remove('hidden')
      return
    }
    const btn = qs('#fd-guardar', cont)
    btn.disabled = true
    btn.textContent = 'Guardando…'
    try {
      await crearDescarte({ fecha: qs('#fd-fecha', cont).value, producto_id: productoId, cantidad: Number(cantidad), unidad, kg_por_unidad: producto.kg_por_unidad, motivo_id: motivoId, observaciones })
      estadoDescartes.mostrarForm = false
      renderDescartes(contenedor)
    } catch (err) {
      console.error(err)
      errorEl.textContent = 'No se pudo guardar. Intentá de nuevo.'
      errorEl.classList.remove('hidden')
      btn.disabled = false
      btn.textContent = 'Guardar descarte'
    }
  })
}

const PRESETS_REPORTES = [

let estadoReportes = { preset: 'mes', molinoId: '', productoId: '', rango: calcularRango('mes') }

  chartsReportes.forEach((c) => c.destroy())

          <input type="date" id="rep-hasta" class="input !w-auto py-1.5" value="${st.rango.hasta}" />
        </div>
        <select id="rep-molino" class="input !w-auto text-xs py-1.5">

      <div class="card overflow-x-auto">
        <table class="w-full table-clean min-w-[600px]">

          <tbody>
            ${resumen.map((r) => `
              <tr>
                <td class="pl-4 font-medium text-crust-900">${escapeHtml(r.producto.nombre)}</td>
                <td>${fmtUnidad(r.stockActualKg, r.producto)}</td>
                <td>${fmtUnidad(r.comprasKg, r.producto)}</td>
                <td>${fmtUnidad(r.consumoTotalKg, r.producto)}</td>

                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : ''}
    </div>
  `

  destruirCharts()
  if (evolucion.length > 0) {
    chartsReportes.push(new Chart(qs('#chart-evolucion', contenedor), {
      type: 'line',
      data: {
        labels: evolucion.map((e) => fechaCorta(e.fecha)),
        datasets: [
          { label: `Stock físico (${unidadPlural(producto.unidad)})`, data: evolucion.map((e) => Number(kgAUnidad(e.stockFisicoKg, producto).toFixed(1))), borderColor: '#C89B3C', backgroundColor: '#C89B3C', tension: 0.25 },
          { label: `Consumo del período (${unidadPlural(producto.unidad)})`, data: evolucion.map((e) => Number(kgAUnidad(e.consumoKg, producto).toFixed(1))), borderColor: '#5C4630', backgroundColor: '#5C4630', tension: 0.25 },
        ],
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } },
    }))
  }
}

let estadoAdmin = { tab: 'Molinos' }
const TABS_ADMIN = ['Molinos', 'Productos', 'Configuración']

  contenedor.innerHTML = `
    <div class="space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="font-display text-2xl font-semibold text-crust-900">Administración</h1>
          <p class="text-sm text-crust-600 mt-1">Molinos, productos y parámetros del sistema. Nada acá queda fijo en el código.</p>
        </div>
        <a href="#/administracion/stock-inicial" class="btn-secondary">Configurar stock inicial</a>
      </div>
      <div class="flex gap-1.5 border-b border-crust-800/10">
        ${TABS_ADMIN.map((t) => `<button data-tab="${t}" class="admin-tab px-3.5 py-2 text-sm font-semibold border-b-2 -mb-px transition-colors ${estadoAdmin.tab === t ? 'border-wheat-500 text-crust-900' : 'border-transparent text-crust-500 hover:text-crust-800'}">${t}</button>`).join('')}

      <div id="admin-tab-content"></div>

async function renderTabMolinos(cont) {

  const molinos = await listarMolinos(false)
  cont.innerHTML = `
    <div class="space-y-4 max-w-xl">
      <div class="card divide-y divide-crust-800/10">
        ${molinos.map((m) => `
          <div class="px-4 py-3 flex items-center justify-between gap-3">
            <p class="font-medium ${m.activo ? 'text-crust-900' : 'text-crust-400 line-through'}">${escapeHtml(m.nombre)}</p>
            <div class="flex items-center gap-2 shrink-0">
              <button class="btn-editar-molino text-xs text-crust-500 hover:text-crust-800" data-id="${m.id}" data-nombre="${escapeHtml(m.nombre)}">Editar</button>
              <button class="btn-toggle-molino text-xs ${m.activo ? 'text-rust-600' : 'text-sage-600'} hover:underline" data-id="${m.id}" data-activo="${m.activo}">${m.activo ? 'Desactivar' : 'Activar'}</button>

        <button id="btn-crear-molino" class="btn-primary shrink-0">+ Crear molino</button>

  qsa('.btn-editar-molino', cont).forEach((btn) => btn.addEventListener('click', async () => {

    await actualizarMolino(btn.dataset.id, nuevoNombre)
    renderTabMolinos(cont)
  }))
  qsa('.btn-toggle-molino', cont).forEach((btn) => btn.addEventListener('click', async () => {
    await alternarActivoMolino(btn.dataset.id, btn.dataset.activo !== 'true')

function renderFormProducto(cont, molinos, productos, producto) {
  const formCont = qs('#form-producto-container', cont)
  const molinoId = producto?.molino_id || molinos[0]?.id || ''
  formCont.innerHTML = `
    <div class="card p-5 space-y-3 max-w-xl">
      <p class="font-display font-semibold text-lg text-crust-900">${producto ? 'Editar producto' : 'Nuevo producto'}</p>
      <div class="grid md:grid-cols-2 gap-3">
        <div>
          <label class="label">Molino</label>
          <select id="fp-molino" class="input">${molinos.map((m) => `<option value="${m.id}" ${molinoId === m.id ? 'selected' : ''}>${escapeHtml(m.nombre)}</option>`).join('')}</select>
        </div>
        <div><label class="label">Nombre del producto</label><input id="fp-nombre" class="input" value="${escapeHtml(producto?.nombre || '')}" /></div>
        <div>
          <label class="label">Unidad de compra</label>
          <select id="fp-unidad" class="input">
            <option value="kg" ${producto?.unidad === 'kg' ? 'selected' : ''}>kg</option>
            <option value="bolsa" ${!producto || producto.unidad === 'bolsa' ? 'selected' : ''}>bolsa</option>
            <option value="unidad" ${producto?.unidad === 'unidad' ? 'selected' : ''}>unidad</option>
          </select>
        </div>
        <div><label class="label">Kg por unidad</label><input type="number" min="0" id="fp-kg" class="input" value="${producto?.kg_por_unidad ?? 25}" /></div>
        <div><label class="label">Stock mínimo (bolsas)</label><input type="number" min="0" id="fp-stock-min" class="input" value="${producto ? (Number(producto.stock_minimo) / Number(producto.kg_por_unidad || 1)).toFixed(1) : 0}" /></div>
      </div>
      <p id="fp-error" class="text-sm text-rust-600 hidden"></p>
      <div class="flex gap-2 justify-end pt-2 border-t border-crust-800/10">
        <button id="fp-cancelar" type="button" class="btn-secondary">Cancelar</button>
        <button id="fp-guardar" type="button" class="btn-primary">Guardar</button>
      </div>
    </div>
  `
  qs('#fp-cancelar', formCont).addEventListener('click', () => { formCont.innerHTML = '' })
  qs('#fp-guardar', formCont).addEventListener('click', async () => {
    const errorEl = qs('#fp-error', formCont)
    const nombre = qs('#fp-nombre', formCont).value.trim()
    const molino = qs('#fp-molino', formCont).value
    if (!molino || !nombre) { errorEl.textContent = 'Completá molino y nombre.'; errorEl.classList.remove('hidden'); return }
    const kgPorUnidad = Number(qs('#fp-kg', formCont).value) || 1
    const input = {
      molino_id: molino, nombre, unidad: qs('#fp-unidad', formCont).value,
      kg_por_unidad: kgPorUnidad,
      stock_minimo: (Number(qs('#fp-stock-min', formCont).value) || 0) * kgPorUnidad,
    }
    const btn = qs('#fp-guardar', formCont)
    btn.disabled = true
    try {
      if (producto) await actualizarProducto(producto.id, input)
      else await crearProducto(input)
      renderTabProductos(cont)
    } catch (err) {
      console.error(err)
      errorEl.textContent = 'No se pudo guardar.'
      errorEl.classList.remove('hidden')
      btn.disabled = false
    }
  })
}

let estadoStockInicial = { fecha: hoyISO(), valores: {}, mensaje: '' }

async function renderStockInicial(contenedor) {
  contenedor.innerHTML = `<p class="text-sm text-crust-600">Cargando…</p>`
  const [productos, vigente] = await Promise.all([listarProductos(true), obtenerStockInicialVigente()])
  const molinos = Array.from(new Set(productos.map((p) => p.molino_nombre)))
  const st = estadoStockInicial

  contenedor.innerHTML = `
    <div class="space-y-6 max-w-2xl">
      <div>
        <h1 class="font-display text-2xl font-semibold text-crust-900">Configuración de stock inicial</h1>
        <p class="text-sm text-crust-600 mt-1">Se carga una única vez por producto. Es la base de todos los cálculos posteriores — para modificarlo después vas a tener que confirmarlo explícitamente.</p>
      </div>
      <div class="card p-4 max-w-[240px]">
        <label class="label">Fecha del inventario inicial</label>
        <input type="date" id="si-fecha" class="input" value="${st.fecha}" />
      </div>
      ${st.mensaje ? `<p class="text-sm text-sage-600">${escapeHtml(st.mensaje)}</p>` : ''}
      ${molinos.map((nombreMolino) => `
        <div class="card overflow-hidden">
          <div class="px-4 py-3 border-b border-crust-800/10 bg-flour-100/60"><p class="font-display font-semibold text-crust-900">${escapeHtml(nombreMolino)}</p></div>
          <div class="divide-y divide-crust-800/10">
            ${productos.filter((p) => p.molino_nombre === nombreMolino).map((p) => `
              <div class="px-4 py-3.5 flex items-center justify-between gap-4">
                <div>
                  <p class="font-medium text-crust-900">${escapeHtml(p.nombre)}</p>
                  ${vigente[p.id] ? `<p class="text-xs text-crust-500">Actual: ${fmtUnidad(Number(vigente[p.id].cantidad_kg), p)} (desde ${fechaCorta(vigente[p.id].fecha)})</p>` : ''}
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <input type="number" min="0" class="input w-28 si-valor" data-id="${p.id}" placeholder="0" value="${vigente[p.id] ? kgAUnidad(Number(vigente[p.id].cantidad_kg), p).toFixed(1) : ''}" />
                  <span class="text-sm text-crust-500">${unidadPlural(p.unidad)}</span>
                  <button class="btn-secondary !py-2 !px-3 text-xs btn-guardar-si" data-id="${p.id}">Guardar</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `

  qs('#si-fecha', contenedor).addEventListener('change', (e) => { st.fecha = e.target.value })
  qsa('.si-valor', contenedor).forEach((input) => input.addEventListener('input', (e) => { st.valores[e.target.dataset.id] = e.target.value }))
  qsa('.btn-guardar-si', contenedor).forEach((btn) => btn.addEventListener('click', async () => {
    const productoId = btn.dataset.id
    const producto = productos.find((p) => p.id === productoId)
    const input = qs(`.si-valor[data-id="${productoId}"]`, contenedor)
    const cantidadUnidad = Number(input.value)
    if (!(cantidadUnidad >= 0)) return
    const cantidadKg = unidadAKg(cantidadUnidad, producto)

    const yaTeniaValor = Boolean(vigente[productoId])
    if (yaTeniaValor) {
      const confirmado = window.confirm(`${producto.nombre} ya tiene un stock inicial cargado (${fmtUnidad(Number(vigente[productoId].cantidad_kg), producto)}). ¿Confirmás que querés modificarlo? Esto puede afectar todos los cálculos posteriores.`)
      if (!confirmado) return
    }
    const motivo = yaTeniaValor ? (window.prompt('Motivo de la modificación:') || undefined) : undefined
    btn.disabled = true
    btn.textContent = 'Guardando…'
    await guardarStockInicial(productoId, cantidadKg, st.fecha, motivo)
    st.mensaje = `Stock inicial de ${producto.nombre} guardado.`
    renderStockInicial(contenedor)
  }))
}

// ---------------------------------------------------------------------------
// APP: ORQUESTADOR PRINCIPAL
// ---------------------------------------------------------------------------

async function renderApp() {
  const root = qs('#app')

  if (!obtenerConfigGuardada()) {
    renderConfig(root)
    return
  }
  if (!sb) inicializarSupabase()
  if (sesionActual === null) {
    // Todavía no se resolvió la sesión (primera carga) o no hay usuario logueado.
    const { data } = await sb.auth.getSession()
    sesionActual = data.session
    if (!sesionActual) {
      renderLogin(root)
      return
    }
  }

  const [rutaBase, sub, subId] = rutaActual().split('/')
  root.innerHTML = layoutHtml(rutaBase, '<p class="text-sm text-crust-600">Cargando…</p>')
  qs('#btn-cerrar-sesion', root).addEventListener('click', async () => { await cerrarSesion() })

  const contenido = qs('#contenido', root)
  try {
    if (rutaBase === 'dashboard') await renderDashboard(contenido)
    else if (rutaBase === 'compras') await renderCompras(contenido)
    else if (rutaBase === 'conteos' && sub === 'nuevo') await renderNuevoConteo(contenido)
    else if (rutaBase === 'conteos') await renderConteos(contenido)
    else if (rutaBase === 'reportes' && sub) await renderProductoDetalle(contenido, sub)
    else if (rutaBase === 'reportes') await renderReportes(contenido)
    else if (rutaBase === 'administracion' && sub === 'stock-inicial') await renderStockInicial(contenido)
    else if (rutaBase === 'administracion') await renderAdministracion(contenido)
    else await renderDashboard(contenido)
  } catch (err) {
    console.error(err)
    contenido.innerHTML = `
      <div class="card p-6 border-l-4 border-rust-500/50">
        <p class="font-display font-semibold text-crust-900">Ocurrió un error al cargar esta pantalla</p>
        <p class="text-sm text-crust-600 mt-1">Revisá la conexión a Supabase y las políticas de RLS. Detalle técnico: ${escapeHtml(err.message || String(err))}</p>
      </div>
    `
  }
}

// Arranque
document.addEventListener('DOMContentLoaded', () => {
  if (inicializarSupabase()) {
    cargarSesion().then(renderApp)
  } else {
    renderApp()
  }
})
